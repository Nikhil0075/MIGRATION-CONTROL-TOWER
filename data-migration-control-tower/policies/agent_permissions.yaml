# Ceiling permissions per agent identity, per master doc §4.2 and §20.1.
#
# Enforced at two layers (Deploy & Harden Phase 1, docs/adr/0001-two-layer-
# policy-enforcement.md): tools/registry.py::invoke_capability() checks
# each agent's "capability:<capability-string>" entry below before a
# handler runs at all (coarse — "is this agent allowed to be invoked for
# this capability"); tools/policy_engine.py::authorize() checks the
# finer-grained action entries (source.catalog.sql_server etc.)
# independently, at the point each sensitive tool call actually happens,
# with its own real resource_class. See docs/GOVERNANCE.md.
#
# data_classes: METADATA | MASKED | PII | PRODUCTION
# decision:     ALLOW | DENY | REQUIRE_APPROVAL

orchestrator:
  allowed_tools:
    - firestore.write_run_state
    - registry.resolve   # placeholder for Block C; unused until then
  denied_tools:
    - production.write

discovery:
  allowed_tools:
    - capability:discovery.catalog.estate
    - source.catalog.sql_server
    - source.catalog.oracle_corpus
    - source.catalog.dag_artifacts
    - source.catalog.registered_estate   # tools/adapters/ generic estate-binding discovery path
    - firestore.write_catalog
  denied_tools:
    - source.raw_pii_read
    - target.write
    - production.write
  data_classes:
    - METADATA

lineage:
  allowed_tools:
    - capability:lineage.graph.build
    - source.catalog.read   # metadata + code read only
    - lineage.graph.write
  denied_tools:
    - source.raw_pii_read
    - production.write
    - iam.modify
  data_classes:
    - METADATA

risk:
  allowed_tools:
    - capability:risk.assess.estate
    - source.sample.masked
    - schema.metadata.read
    - policy.catalog.read
  denied_tools:
    - production.write
    - secret.read
  data_classes:
    - METADATA
    - MASKED

planner:
  allowed_tools:
    - capability:planner.plan.propose
    - schema.metadata.read
    - sql.translate
    - plan.write
  denied_tools:
    - production.cutover
  data_classes:
    - METADATA

validation:
  allowed_tools:
    - capability:validation.reconcile.source_target
    - source.query.masked
    - target.query.masked
    - hash.compute
  denied_tools:
    - target.ddl
  data_classes:
    - METADATA
    - MASKED

cutover:
  allowed_tools:
    - capability:cutover.request_approval
    - migration.execute.approved
    - cutover.execute.approved
  denied_tools:
    - approval.self_issue
    - source.raw_pii_read
  approval_required_actions:
    - production.write
    - cutover.execute.approved

finance:
  # Cross-department cataloging demo (master doc §26.2's "Cross-department
  # cataloging" row): infrastructure/seed_finance_agent.py's card carries
  # this same shape inline as card["permissions"] today, unused by
  # anything at runtime — this block is the one tools/policy_engine.py
  # actually reads. Kept in sync manually; drift here is a real bug (see
  # docs/adr/0001, "the finance-impact gap this surfaces").
  allowed_tools:
    - capability:impact.assessment.finance_reporting
    - lineage.graph.read
  denied_tools:
    - source.raw_pii_read
    - target.write
    - production.write
  data_classes:
    - METADATA
